<!-- Custom CSS for specialized elements -->
<style data-purpose="custom-sliders">
    /* Dotted Slider Styling */
    .dotted-track {
      background-image: radial-gradient(circle, #555562 1.5px, transparent 1.5px);
      background-size: 14px 100%;
      background-position: center;
      background-repeat: repeat-x;
    }

    /* Range slider custom appearance */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 9999px;
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
      cursor: pointer;
      margin-top: -8px;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: transparent;
    }
  </style>
<style data-purpose="arc-gauge">
    .gauge-container {
      position: relative;
      width: 280px;
      height: 140px;
      margin: 0 auto;
      overflow: hidden;
    }

    .tuner-arc {
      position: absolute;
      width: 260px;
      height: 260px;
      left: 10px;
      top: 10px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0 35px rgba(255, 255, 255, 0.05), 0 0 30px rgba(255, 255, 255, 0.03);
    }

    /* Realistic Tuner Needle Swing & Dynamic Color Transitions */
    @keyframes tunerSwing {
      0% {
        transform: rotate(-38deg);
      }
      18% {
        transform: rotate(26deg);
      }
      35% {
        transform: rotate(-14deg);
      }
      50% {
        transform: rotate(6deg);
      }
      62% {
        transform: rotate(-2deg);
      }
      70% {
        transform: rotate(0deg);
      }
      82% {
        transform: rotate(0deg);
      }
      89% {
        transform: rotate(1.5deg);
      }
      94% {
        transform: rotate(-1deg);
      }
      100% {
        transform: rotate(-38deg);
      }
    }

    @keyframes tunerColorCycle {
      /* -38deg: far flat (RED) */
      0% {
        stroke: #ef4444;
        filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.85));
      }
      /* Moving toward center (ORANGE) */
      9% {
        stroke: #f97316;
        filter: drop-shadow(0 0 7px rgba(249, 115, 22, 0.8));
      }
      /* Crossing center briefly */
      13% {
        stroke: #22c55e;
        filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.95));
      }
      /* +26deg: sharp (ORANGE/RED) */
      18% {
        stroke: #ef4444;
        filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.85));
      }
      26% {
        stroke: #f97316;
        filter: drop-shadow(0 0 7px rgba(249, 115, 22, 0.8));
      }
      /* -14deg (ORANGE) */
      35% {
        stroke: #f97316;
        filter: drop-shadow(0 0 7px rgba(249, 115, 22, 0.75));
      }
      /* +6deg (near sweet spot) */
      50% {
        stroke: #84cc16;
        filter: drop-shadow(0 0 8px rgba(132, 204, 22, 0.85));
      }
      /* Settling right on center / in-tune (VIBRANT GREEN) */
      62% {
        stroke: #22c55e;
        filter: drop-shadow(0 0 12px rgba(34, 197, 94, 1));
      }
      70% {
        stroke: #22c55e;
        filter: drop-shadow(0 0 14px rgba(34, 197, 94, 1));
      }
      82% {
        stroke: #22c55e;
        filter: drop-shadow(0 0 14px rgba(34, 197, 94, 1));
      }
      88% {
        stroke: #4ade80;
        filter: drop-shadow(0 0 10px rgba(74, 222, 128, 0.9));
      }
      95% {
        stroke: #f97316;
        filter: drop-shadow(0 0 7px rgba(249, 115, 22, 0.8));
      }
      100% {
        stroke: #ef4444;
        filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.85));
      }
    }

    @keyframes tunerBallColorCycle {
      0% {
        fill: #ef4444;
        filter: drop-shadow(0 0 6px #ef4444);
      }
      9% {
        fill: #f97316;
        filter: drop-shadow(0 0 5px #f97316);
      }
      13% {
        fill: #22c55e;
        filter: drop-shadow(0 0 8px #22c55e);
      }
      18% {
        fill: #ef4444;
        filter: drop-shadow(0 0 6px #ef4444);
      }
      26% {
        fill: #f97316;
        filter: drop-shadow(0 0 5px #f97316);
      }
      35% {
        fill: #f97316;
        filter: drop-shadow(0 0 5px #f97316);
      }
      50% {
        fill: #84cc16;
        filter: drop-shadow(0 0 7px #84cc16);
      }
      62% {
        fill: #22c55e;
        filter: drop-shadow(0 0 10px #22c55e);
      }
      70% {
        fill: #22c55e;
        filter: drop-shadow(0 0 12px #22c55e);
      }
      82% {
        fill: #22c55e;
        filter: drop-shadow(0 0 12px #22c55e);
      }
      88% {
        fill: #4ade80;
        filter: drop-shadow(0 0 8px #4ade80);
      }
      95% {
        fill: #f97316;
        filter: drop-shadow(0 0 5px #f97316);
      }
      100% {
        fill: #ef4444;
        filter: drop-shadow(0 0 6px #ef4444);
      }
    }

    @keyframes centerNotchGlow {
      0%, 10%, 15%, 58%, 95%, 100% {
        stroke: #ffffff;
        filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.4));
      }
      12%, 14% {
        stroke: #22c55e;
        filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.9));
      }
      62%, 84% {
        stroke: #22c55e;
        filter: drop-shadow(0 0 10px rgba(34, 197, 94, 1));
      }
    }

    @keyframes noteInTunePulse {
      0%, 55%, 96%, 100% {
        color: #ffffff;
        text-shadow: none;
        transform: scale(1);
      }
      62%, 82% {
        color: #22c55e;
        text-shadow: 0 0 16px rgba(34, 197, 94, 0.7), 0 0 32px rgba(34, 197, 94, 0.35);
        transform: scale(1.04);
      }
    }

    @keyframes statusSubGlow {
      0%, 55%, 96%, 100% {
        color: #8e8e98;
      }
      62%, 82% {
        color: #4ade80;
      }
    }

    /* Spectacular Volumetric Light Cloud / Aura Keyframes */
    @keyframes lightCloudGlow {
      0% {
        background: radial-gradient(ellipse at 50% 65%, rgba(239, 68, 68, 0.35) 0%, rgba(220, 38, 38, 0.18) 40%, rgba(239, 68, 68, 0) 75%);
        transform: translate(-50%, -50%) scale(0.92);
        opacity: 0.65;
      }
      9% {
        background: radial-gradient(ellipse at 50% 65%, rgba(249, 115, 22, 0.38) 0%, rgba(234, 88, 12, 0.2) 40%, rgba(249, 115, 22, 0) 75%);
        transform: translate(-50%, -50%) scale(0.96);
        opacity: 0.72;
      }
      13% {
        background: radial-gradient(ellipse at 50% 65%, rgba(34, 197, 94, 0.52) 0%, rgba(16, 185, 129, 0.28) 42%, rgba(34, 197, 94, 0) 75%);
        transform: translate(-50%, -50%) scale(1.06);
        opacity: 0.88;
      }
      18% {
        background: radial-gradient(ellipse at 50% 65%, rgba(239, 68, 68, 0.35) 0%, rgba(220, 38, 38, 0.18) 40%, rgba(239, 68, 68, 0) 75%);
        transform: translate(-50%, -50%) scale(0.92);
        opacity: 0.65;
      }
      26% {
        background: radial-gradient(ellipse at 50% 65%, rgba(249, 115, 22, 0.38) 0%, rgba(234, 88, 12, 0.2) 40%, rgba(249, 115, 22, 0) 75%);
        transform: translate(-50%, -50%) scale(0.96);
        opacity: 0.72;
      }
      35% {
        background: radial-gradient(ellipse at 50% 65%, rgba(249, 115, 22, 0.4) 0%, rgba(234, 88, 12, 0.2) 40%, rgba(249, 115, 22, 0) 75%);
        transform: translate(-50%, -50%) scale(0.95);
        opacity: 0.75;
      }
      50% {
        background: radial-gradient(ellipse at 50% 65%, rgba(132, 204, 22, 0.45) 0%, rgba(101, 163, 13, 0.22) 40%, rgba(132, 204, 22, 0) 75%);
        transform: translate(-50%, -50%) scale(1.02);
        opacity: 0.82;
      }
      /* Settling right on center / In-tune - radiant emerald pulsing cloud */
      62% {
        background: radial-gradient(ellipse at 50% 65%, rgba(34, 197, 94, 0.6) 0%, rgba(16, 185, 129, 0.32) 42%, rgba(34, 197, 94, 0) 78%);
        transform: translate(-50%, -50%) scale(1.1);
        opacity: 0.95;
      }
      70% {
        background: radial-gradient(ellipse at 50% 65%, rgba(16, 185, 129, 0.68) 0%, rgba(34, 197, 94, 0.35) 45%, rgba(16, 185, 129, 0) 80%);
        transform: translate(-50%, -50%) scale(1.15);
        opacity: 1;
      }
      82% {
        background: radial-gradient(ellipse at 50% 65%, rgba(34, 197, 94, 0.62) 0%, rgba(16, 185, 129, 0.32) 42%, rgba(34, 197, 94, 0) 78%);
        transform: translate(-50%, -50%) scale(1.1);
        opacity: 0.95;
      }
      88% {
        background: radial-gradient(ellipse at 50% 65%, rgba(74, 222, 128, 0.48) 0%, rgba(34, 197, 94, 0.25) 40%, rgba(74, 222, 128, 0) 76%);
        transform: translate(-50%, -50%) scale(1.04);
        opacity: 0.85;
      }
      95% {
        background: radial-gradient(ellipse at 50% 65%, rgba(249, 115, 22, 0.38) 0%, rgba(234, 88, 12, 0.2) 40%, rgba(249, 115, 22, 0) 75%);
        transform: translate(-50%, -50%) scale(0.96);
        opacity: 0.72;
      }
      100% {
        background: radial-gradient(ellipse at 50% 65%, rgba(239, 68, 68, 0.35) 0%, rgba(220, 38, 38, 0.18) 40%, rgba(239, 68, 68, 0) 75%);
        transform: translate(-50%, -50%) scale(0.92);
        opacity: 0.65;
      }
    }

    /* Core intense aura at the base center */
    @keyframes lightCloudCoreGlow {
      0%, 18%, 100% {
        background: radial-gradient(circle, rgba(239, 68, 68, 0.45) 0%, rgba(239, 68, 68, 0) 70%);
        transform: translate(-50%, -50%) scale(0.85);
        opacity: 0.5;
      }
      9%, 26%, 35%, 95% {
        background: radial-gradient(circle, rgba(249, 115, 22, 0.5) 0%, rgba(249, 115, 22, 0) 70%);
        transform: translate(-50%, -50%) scale(0.95);
        opacity: 0.65;
      }
      13% {
        background: radial-gradient(circle, rgba(52, 211, 153, 0.7) 0%, rgba(34, 197, 94, 0) 72%);
        transform: translate(-50%, -50%) scale(1.05);
        opacity: 0.85;
      }
      50% {
        background: radial-gradient(circle, rgba(163, 230, 53, 0.6) 0%, rgba(132, 204, 22, 0) 70%);
        transform: translate(-50%, -50%) scale(1.0);
        opacity: 0.75;
      }
      62%, 82% {
        background: radial-gradient(circle, rgba(52, 211, 153, 0.85) 0%, rgba(16, 185, 129, 0.3) 45%, rgba(34, 197, 94, 0) 75%);
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 1;
      }
      70% {
        background: radial-gradient(circle, rgba(110, 231, 183, 0.95) 0%, rgba(16, 185, 129, 0.4) 50%, rgba(34, 197, 94, 0) 78%);
        transform: translate(-50%, -50%) scale(1.28);
        opacity: 1;
      }
      88% {
        background: radial-gradient(circle, rgba(74, 222, 128, 0.7) 0%, rgba(34, 197, 94, 0) 72%);
        transform: translate(-50%, -50%) scale(1.08);
        opacity: 0.8;
      }
    }

    .tuner-light-cloud {
      position: absolute;
      left: 50%;
      top: 68%;
      width: 250px;
      height: 125px;
      border-radius: 50%;
      filter: blur(42px);
      pointer-events: none;
      z-index: 1;
      animation: lightCloudGlow 6.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      mix-blend-mode: screen;
    }

    .tuner-light-cloud-core {
      position: absolute;
      left: 50%;
      top: 72%;
      width: 140px;
      height: 75px;
      border-radius: 50%;
      filter: blur(22px);
      pointer-events: none;
      z-index: 2;
      animation: lightCloudCoreGlow 6.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      mix-blend-mode: screen;
    }

    .tuner-needle-arm {
      transform-origin: 140px 140px;
      animation: tunerSwing 6.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    .tuner-needle-line {
      animation: tunerColorCycle 6.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    .tuner-needle-circle {
      animation: tunerBallColorCycle 6.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    .tuner-center-notch {
      animation: centerNotchGlow 6.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    .tuner-note-label {
      animation: noteInTunePulse 6.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .tuner-hz-label {
      animation: statusSubGlow 6.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .tuner-needle-arm,
      .tuner-needle-line,
      .tuner-needle-circle,
      .tuner-center-notch,
      .tuner-note-label,
      .tuner-hz-label,
      .tuner-light-cloud,
      .tuner-light-cloud-core {
        animation: none !important;
      }
      .tuner-needle-line {
        stroke: #22c55e;
      }
      .tuner-needle-circle {
        fill: #22c55e;
      }
      .tuner-note-label {
        color: #22c55e;
      }
      .tuner-light-cloud {
        background: radial-gradient(ellipse at 50% 65%, rgba(34, 197, 94, 0.55) 0%, rgba(16, 185, 129, 0.25) 45%, rgba(34, 197, 94, 0) 80%);
        transform: translate(-50%, -50%) scale(1.1);
        opacity: 0.9;
      }
      .tuner-light-cloud-core {
        background: radial-gradient(circle, rgba(52, 211, 153, 0.8) 0%, rgba(16, 185, 129, 0.25) 50%, rgba(34, 197, 94, 0) 75%);
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 0.95;
      }
    }
  </style>
</head>
