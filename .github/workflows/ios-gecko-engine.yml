name: iOS Gecko engine kit

# Stage 1 of running YouTube on Gecko inside Transpono (iPhone WebKit cannot
# feed YouTube HLS audio to Web Audio). Builds an "engine kit" without
# compiling Gecko itself:
#   - Gecko headers (dist/include) from `mach build pre-export export` of the
#     exact Firefox release Reynard 0.20.0 uses, with Reynard's patches;
#   - XUL, dylibs and Gecko resources taken from the official Reynard 0.20.0
#     IPA (SHA-256 pinned);
#   - Reynard's GeckoView Swift wrapper (GPL-3.0) and Helper extension,
#     compiled here against those headers/binaries.
# macOS minutes are billed 10x on private repos: on demand or `ios-gecko` only.
on:
  workflow_dispatch:
  push:
    branches: [ios-gecko]
    paths:
      - .github/workflows/ios-gecko-engine.yml

env:
  REYNARD_TAG: "0.20.0"
  REYNARD_IPA_SHA256: 6ebc53836a232d0bb1b655c97dd7b44156e1ee6ca0889ef383069fc7b0a1c1ea

jobs:
  engine-kit:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Check out Reynard ${{ env.REYNARD_TAG }}
        run: |
          git clone --depth 1 --branch "$REYNARD_TAG" https://github.com/minh-ton/reynard-browser.git reynard
          echo "FIREFOX_TAG=$(tr -d '\r\n ' < reynard/engine/release.txt)" >> "$GITHUB_ENV"

      - name: Check out Firefox source
        run: |
          echo "Firefox tag: $FIREFOX_TAG"
          git clone --depth 1 --branch "$FIREFOX_TAG" https://github.com/mozilla-firefox/firefox.git reynard/engine/firefox

      - name: Apply Reynard Gecko patches
        working-directory: reynard
        run: |
          count=0
          while IFS= read -r patch; do
            git -C engine/firefox apply --whitespace=nowarn "$PWD/$patch"
            count=$((count + 1))
          done < <(find patches -name '*.patch' | sort)
          echo "Applied $count patches"

      - name: Install build dependencies
        run: |
          brew install python@3.12 lld cbindgen llvm
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Mozilla toolchains
        uses: actions/cache@v4
        with:
          path: ~/.mozbuild
          key: mozbuild-${{ env.FIREFOX_TAG }}

      - name: Generate Gecko headers (no engine compile)
        working-directory: reynard/engine/firefox
        env:
          CC: clang
          CXX: clang++
          LD: ld64.lld
          MOZ_NOSPAM: "1"
        run: |
          cat > .mozconfig <<'EOF'
          ac_add_options --enable-application=mobile/ios
          ac_add_options --target=aarch64-apple-ios
          ac_add_options --enable-ios-target=13.0
          ac_add_options --enable-optimize
          ac_add_options --enable-release
          ac_add_options --disable-debug
          ac_add_options --disable-tests
          ac_add_options --enable-bootstrap
          EOF
          ./mach configure
          ./mach build pre-export export
          ls obj-aarch64-apple-ios/dist/include/GeckoView | head -50
          test -f obj-aarch64-apple-ios/dist/include/mozilla-config.h

      - name: Take Gecko binaries from the official Reynard IPA
        run: |
          curl -sSL -o Reynard.ipa "https://github.com/minh-ton/reynard-browser/releases/download/${REYNARD_TAG}/Reynard.ipa"
          echo "${REYNARD_IPA_SHA256}  Reynard.ipa" | shasum -a 256 -c -
          unzip -q Reynard.ipa -d reynard-ipa
          APP=reynard-ipa/Payload/Reynard.app
          BIN=reynard/engine/firefox/obj-aarch64-apple-ios/dist/bin
          mkdir -p "$BIN"
          cp -fL "$APP/Frameworks/XUL" "$BIN/XUL"
          cp -fL "$APP/Frameworks/"*.dylib "$BIN/"
          rm -f "$BIN/libswift_Concurrency.dylib"
          # Gecko resources (omni.ja, chrome manifests, defaults…) live here in the IPA.
          rsync -a "$APP/Frameworks/GeckoView.framework/Frameworks/" "$BIN/"
          ls -la "$BIN" | head -40
          du -sh "$BIN"

      - name: Build GeckoView framework and Helper extension
        working-directory: reynard/browser
        run: |
          common=(
            -project Reynard.xcodeproj
            -sdk iphoneos -arch arm64 -configuration Release
            -xcconfig Configuration/Reynard.xcconfig
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
            SYMROOT="$PWD/build"
          )
          xcodebuild build -target GeckoView "${common[@]}" BUILD_LIBRARY_FOR_DISTRIBUTION=YES
          xcodebuild build -target "Reynard Helper" "${common[@]}"
          find build -maxdepth 3 \( -name '*.framework' -o -name '*.appex' \) -print
          ls build/Release-iphoneos/GeckoView.framework/Modules/GeckoView.swiftmodule

      - name: Package engine kit
        run: |
          KIT=engine-kit
          rm -rf "$KIT"; mkdir -p "$KIT/Frameworks" "$KIT/PlugIns"
          BIN=reynard/engine/firefox/obj-aarch64-apple-ios/dist/bin
          OUT=reynard/browser/build/Release-iphoneos
          cp -R "$OUT/GeckoView.framework" "$KIT/Frameworks/"
          mkdir -p "$KIT/Frameworks/GeckoView.framework/Frameworks"
          rsync -a --exclude XUL --exclude '*.dylib' "$BIN/" "$KIT/Frameworks/GeckoView.framework/Frameworks/"
          cp -fL "$BIN/XUL" "$BIN/"*.dylib "$KIT/Frameworks/"
          cp -R "$OUT/Reynard Helper.appex" "$KIT/PlugIns/"
          cp reynard/LICENSE "$KIT/LICENSE-Reynard-GPL-3.0"
          cp reynard/LICENSE.firefox "$KIT/LICENSE-Firefox-MPL-2.0"
          printf 'reynard=%s\nfirefox=%s\nipa_sha256=%s\n' "$REYNARD_TAG" "$FIREFOX_TAG" "$REYNARD_IPA_SHA256" > "$KIT/VERSIONS.txt"
          du -sh "$KIT"; find "$KIT" -maxdepth 3 | head -40
          tar -czf engine-kit.tar.gz "$KIT"

      - uses: actions/upload-artifact@v4
        with:
          name: transpono-gecko-engine-kit
          path: engine-kit.tar.gz
          retention-days: 30
