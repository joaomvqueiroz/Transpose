name: transpose_mobile
description: Transpono musical practice app for Android and iOS.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  audio_core:
    path: ../../packages/audio_core
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  youtube_native_audio:
    path: ../../packages/youtube_native_audio
  gecko_view:
    path: ../../packages/gecko_view
  player_core:
    path: ../../packages/player_core
  video_player: ^2.14.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.13.0
  webview_flutter_wkwebview: ^3.26.0
  record: ^7.1.1

dev_dependencies:
  sqflite_common_ffi: ^2.4.3
  shared_preferences_platform_interface: ^2.4.2
  webview_flutter_platform_interface: ^2.15.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.10.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/transpono_launcher.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/branding/transpono_adaptive.png
  remove_alpha_ios: true
  background_color_ios: "#000000"

flutter:
  uses-material-design: true
  assets:
    - assets/qa_tone.wav
    - assets/piano/
    - assets/visual_refs/concert_guitarist_hd.png
    - assets/web/
    - assets/stems_licenses/
