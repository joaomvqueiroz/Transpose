name: youtube_native_audio
description: iOS-only native playback of a YouTube video's audio track with pitch, speed and effects.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: YoutubeNativeAudioPlugin
